name: PR Check — develop

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-develop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test & coverage check
        run: mvn verify -B --no-transfer-progress

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: target/site/jacoco/
          retention-days: 14
