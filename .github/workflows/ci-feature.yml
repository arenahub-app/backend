name: CI — Feature Branch

on:
  push:
    branches-ignore:
      - main
      - develop
    tags-ignore:
      - '**'

concurrency:
  group: ci-feature-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn verify -B --no-transfer-progress

      - name: Publish test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  open-pr:
    name: Open PR → develop
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Create PR to develop if not exists
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PAT_TOKEN não configurado — PR automática desabilitada."
            exit 0
          fi

          BRANCH="${GITHUB_REF_NAME}"
          LAST_MSG=$(git log -1 --format='%s')
          EXISTING=$(gh pr list --base develop --head "$BRANCH" --state open --json number --jq length)

          if [ "$EXISTING" -eq 0 ]; then
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "$LAST_MSG" \
              --body "PR criada automaticamente após CI passar na branch \`${BRANCH}\`."
            echo "PR criada: $BRANCH → develop"
          else
            echo "PR já existe para $BRANCH → develop, ignorando."
          fi
