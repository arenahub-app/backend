name: CD — develop

on:
  push:
    branches:
      - develop

concurrency:
  group: cd-develop
  cancel-in-progress: false

jobs:
  validate:
    name: Full Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build, test & coverage check
        run: mvn verify -B --no-transfer-progress

      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn sonar:sonar -B --no-transfer-progress

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-develop-${{ github.run_id }}
          path: target/site/jacoco/
          retention-days: 14

  release:
    name: Version Bump & PR → main
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Calculate next semantic version
        id: semver
        run: |
          # Get last tag (default to v0.0.0 if none)
          LAST_TAG=$(git tag -l "v*" --sort=-v:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            echo "Nenhuma tag encontrada — iniciando em 1.0.0"
            NEW_VERSION="1.0.0"
            BUMP="initial"
          else
            echo "Última tag: $LAST_TAG"
            CURRENT="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            COMMITS=$(git log "${LAST_TAG}..HEAD" --format="%s %b" 2>/dev/null)
            echo "Commits desde $LAST_TAG:"
            echo "$COMMITS"

            if echo "$COMMITS" | grep -qE "(BREAKING CHANGE|!:)"; then
              BUMP="major"
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
              BUMP="minor"
              MINOR=$((MINOR + 1)); PATCH=0
            else
              BUMP="patch"
              PATCH=$((PATCH + 1))
            fi

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Próxima versão: $NEW_VERSION (bump: $BUMP)"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP"           >> "$GITHUB_OUTPUT"
          echo "last_tag=${LAST_TAG:-nenhuma}" >> "$GITHUB_OUTPUT"

      - name: Update pom.xml version
        run: |
          mvn versions:set -DnewVersion=${{ steps.semver.outputs.version }} \
            -DgenerateBackupPoms=false -B --no-transfer-progress

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        run: |
          git add pom.xml
          if git diff --staged --quiet; then
            echo "pom.xml já está na versão ${{ steps.semver.outputs.version }}, nenhum commit necessário."
          else
            git commit -m "chore(release): bump version to ${{ steps.semver.outputs.version }} [skip ci]"
          fi

      - name: Create and push tag
        run: |
          TAG="v${{ steps.semver.outputs.version }}"
          if git tag -l | grep -q "^${TAG}$"; then
            echo "Tag $TAG já existe, ignorando."
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin develop --follow-tags

      - name: Create PR develop → main
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          VERSION="v${{ steps.semver.outputs.version }}"
          BUMP="${{ steps.semver.outputs.bump }}"
          LAST_TAG="${{ steps.semver.outputs.last_tag }}"

          EXISTING=$(gh pr list --base main --head develop --state open --json number --jq length)

          if [ "$EXISTING" -eq 0 ]; then
            COMMITS_MD=$(git log "origin/main..HEAD" --oneline 2>/dev/null | sed 's/^/- /' || echo "- (commits não disponíveis)")

            gh pr create \
              --base main \
              --head develop \
              --title "release: $VERSION" \
              --body "$(printf '## Release %s\n\n**Tipo de bump:** %s  \n**Versão anterior:** %s\n\n### Commits incluídos\n%s\n\n---\n_Aguardando aprovação para merge em main._' \
                "$VERSION" "$BUMP" "$LAST_TAG" "$COMMITS_MD")"

            echo "PR develop → main criada para $VERSION"
          else
            echo "PR develop → main já existe. Atualizando título..."
            PR_NUMBER=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
            gh pr edit "$PR_NUMBER" --title "release: $VERSION"
          fi
