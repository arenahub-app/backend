<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Redefinição de senha</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px;">
  <div style="max-width: 600px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 32px;">
    <h2 style="color: #1a1a2e;">Redefinição de senha</h2>
    <p>Recebemos uma solicitação de redefinição de senha para sua conta. Clique no botão abaixo para criar uma nova senha. O link expira em <strong>1 hora</strong>.</p>
    <a th:href="${resetUrl}"
       style="display:inline-block; background:#e63946; color:#fff; padding:12px 24px;
              border-radius:6px; text-decoration:none; font-weight:bold; margin:16px 0;">
      Redefinir senha
    </a>
    <p style="color:#888; font-size:13px;">
      Se você não solicitou a redefinição, ignore este email — sua senha permanece a mesma.
    </p>
  </div>
</body>
</html>
