<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Senha alterada</title>
</head>
<body style="font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px;">
  <div style="max-width: 600px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 32px;">
    <h2 style="color: #1a1a2e;">Sua senha foi alterada</h2>
    <p>A senha da sua conta ArenaHub foi alterada em <strong th:text="${changedAt}">data</strong>.</p>
    <p>Se você não realizou esta alteração, entre em contato conosco imediatamente e redefina sua senha.</p>
    <p style="color:#888; font-size:13px;">
      Este é um aviso de segurança automático.
    </p>
  </div>
</body>
</html>
