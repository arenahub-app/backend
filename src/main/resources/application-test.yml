spring:
  mail:
    host: localhost
    port: 3025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  datasource:
    url: jdbc:tc:postgresql:16:///arenahub_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  flyway:
    enabled: true

  jpa:
    properties:
      hibernate:
        format_sql: true

arenahub:
  frontend:
    base-url: http://localhost:5173

  cors:
    allowed-origins: http://localhost:5173

  mail:
    from: test@arenahub.app

  jwt:
    secret: test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7

  storage:
    r2:
      endpoint: http://localhost:9000
      access-key: test
      secret-key: test
      bucket: arenahub-test
      public-url: http://localhost:9000/arenahub-test

  ai:
    validation:
      url: http://localhost:9001/validate
      api-key: test-key
      timeout-seconds: 5
